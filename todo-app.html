<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 40px 16px;
    color: #1a1a1a;
  }
  .app {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 16px; font-size: 22px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  button {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
  .add-btn {
    background: #2563eb;
    color: #fff;
    padding: 10px 16px;
  }
  .add-btn:hover { background: #1d4ed8; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .text { flex: 1; font-size: 15px; }
  li.done .text { text-decoration: line-through; color: #999; }
  .del-btn {
    background: transparent;
    color: #c0392b;
    padding: 4px 8px;
    font-size: 18px;
    line-height: 1;
  }
  .del-btn:hover { color: #e74c3c; }
  .empty { color: #999; text-align: center; padding: 16px 0; }
</style>
</head>
<body>
  <div class="app">
    <h1>To-Do List</h1>
    <form id="form">
      <input type="text" id="input" placeholder="Add a task..." autocomplete="off" />
      <button type="submit" class="add-btn">Add</button>
    </form>
    <ul id="list"></ul>
  </div>

<script>
  const STORAGE_KEY = "todos";
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");

  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    list.innerHTML = "";
    if (todos.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No tasks yet.";
      list.appendChild(empty);
      return;
    }
    todos.forEach((todo, i) => {
      const li = document.createElement("li");
      if (todo.done) li.className = "done";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.addEventListener("change", () => {
        todos[i].done = checkbox.checked;
        save();
        render();
      });

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = todo.text;

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "×";
      delBtn.title = "Delete";
      delBtn.addEventListener("click", () => {
        todos.splice(i, 1);
        save();
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    todos.push({ text: value, done: false });
    input.value = "";
    save();
    render();
  });

  render();
</script>
</body>
</html>
